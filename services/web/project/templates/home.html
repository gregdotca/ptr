<!doctype html>
<html lang="en">
<head>
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_title }}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    {% include 'custom.headers' ignore missing %}
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet" type="text/css" />
</head>
<body class="p-8">
<div id="content">
    <h1 class="text-2xl mb-3"><a href="/">{{ app_title }}</a></h1>
    <form method="POST" action="/" class="pb-7">
        <div class="flex">
            <fieldset class="fieldset bg-base-200 border border-base-300 p-10 -ml-1 rounded-box">
                <input id="address" class="input" name="address" aria-label="Address" placeholder="Address" value="{{ address }}" autofocus><BR>
                <input class="btn btn-accent dark:btn-primary" type="submit" name="submit" value="Lookup" onclick="document.getElementById('loading').style.display = 'block';">
            </fieldset>
        </div>
        <div id="loading" class="pt-8" style="display: none;"><span class="loading loading-xl"></span></div>
    </form>
    {{ page_body }}
</div>
</body>
</html>
